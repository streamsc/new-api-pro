      - series: "new_api_user_wallet_balance_quota{job=\"new-api\",instance=\"wallet-b\",deployment=\"wallet-test\",user_id=\"1\"}"
        values: "20160x10081"
      - series: "new_api_user_used_quota{job=\"new-api\",instance=\"wallet-a\",deployment=\"wallet-test\",user_id=\"3\"}"
