        values: "1x10081"
      - series: "new_api_wallet_snapshot_success{job=\"new-api\",instance=\"wallet-b\",deployment=\"wallet-test\"}"
        values: "1x10081"
      - series: "new_api_wallet_snapshot_timestamp_seconds{job=\"new-api\",instance=\"wallet-b\",deployment=\"wallet-test\"}"
