global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
rule_files:
  - concurrency.rules.yml
scrape_configs:
  - job_name: new-api
    metrics_path: /metrics
    static_configs:
      - targets: ["new-api-1:9080", "new-api-2:9080"]
        labels:
          deployment: gateway-production
          concurrency_domain: shared-gateway-redis
