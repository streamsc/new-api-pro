name: Release (Linux, macOS, Windows)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Prepare embedded frontend placeholder
        run: |
          mkdir -p web/dist
          printf '<!doctype html>' > web/dist/index.html
      - name: Run Go tests
        run: make test

  linux:
    name: Linux Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=preflight-${GITHUB_SHA:0:12}
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-arm64-$VERSION
      - name: Verify Backend version
        run: test "$(./new-api-$VERSION -version)" = "$VERSION"
      - name: Generate checksums
        run: sha256sum new-api-* > checksums-linux.txt
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: |
            new-api-*
            checksums-linux.txt
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS Release
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=preflight-${GITHUB_SHA:0:12}
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-macos-$VERSION
      - name: Verify Backend version
        run: test "$(./new-api-macos-$VERSION -version)" = "$VERSION"
      - name: Generate checksums
        run: shasum -a 256 new-api-macos-* > checksums-macos.txt
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            new-api-macos-*
            checksums-macos.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows Release
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=preflight-${GITHUB_SHA:0:12}
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-$VERSION.exe
      - name: Verify Backend version
        run: test "$(./new-api-$VERSION.exe -version | tr -d '\r')" = "$VERSION"
      - name: Generate checksums
        run: sha256sum new-api-*.exe > checksums-windows.txt
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            new-api-*.exe
            checksums-windows.txt
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish prerelease
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          prerelease: true
          body: |
            Downstream release based on upstream `v1.0.0-rc.40`.

            Changes:
            - Upgrades the upstream baseline to rc.40, including request policies, task plugins, protocol/media fixes, and billing updates.
            - Preserves Redis Sentinel, audio transcription/translation SSE, channel concurrency limits and sampling, Prometheus metrics, and authenticated HMAC headers.
            - Propagates client cancellation before upstream headers and during response-body reads, releasing the channel lease without retrying or disabling the channel.
            - Retains independent RelayKit validation and Artifactory-compatible multi-architecture GHCR publication gates.

            Migration requirements:
            - Stop writers and back up both primary and separate log databases before upgrading.
            - Existing MySQL/PostgreSQL user wallet columns must be BIGINT; rc.40 rejects 32-bit wallet schemas before migration.
            - Review task-plugin LONGTEXT DDL, options/uniqueness repairs, audit tables, and explicit trust_quota_usd=0 during rollout.
            - Realtime, Responses WebSocket, and task-plugin requests are outside the standard Relay concurrency counter.

            Review migration requirements in `docs/upgrade-v1.0.0-rc.40-pro.md` before deployment.

            Validation boundaries:
            - ARM64 candidate built from the release Dockerfile and deployed to new-api-2; normal/streaming Responses, billing counters, and channel concurrency smoke checks passed.
            - No separate AMD64 environment acceptance was performed; existing automated CI gates remain enabled.
            - Real-vendor audio and task-plugin execution/settlement, production-scale load, and Artifactory import remain unverified.

            Container image: `ghcr.io/streamsc/new-api-pro:${{ github.ref_name }}`
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
