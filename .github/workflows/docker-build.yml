name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v1.0.0-rc.24-pro.1)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify image source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve tag
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi

          TAG_TYPE=$(git cat-file -t "refs/tags/$TAG")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::Release tag '$TAG' must be annotated"
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG")
          if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checked out commit does not match tag '$TAG'"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "${TAG}" > VERSION
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Prepare embedded frontend placeholders
        run: |
          mkdir -p web/dist
          printf '<!doctype html>' > web/dist/index.html
      - name: Run Go tests
        run: make test

  build_multi_arch:
    name: Build, validate, and push multi-arch OCI image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Write VERSION
        env:
          RESOLVED_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          TAG="$RESOLVED_TAG"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Upstream distribution remains calciumion/new-api; this fork publishes its release line to GHCR.
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit }}
      - name: Build & push compatible OCI image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          outputs: type=registry,oci-mediatypes=true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-multi-arch
          cache-to: type=gha,mode=max,scope=release-multi-arch
          provenance: mode=min
          sbom: false
      - name: Validate OCI index and attestations
        run: |
          RAW_MANIFEST=$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:${TAG}")
          echo "$RAW_MANIFEST" > /tmp/index.json

          jq -e '.mediaType == "application/vnd.oci.image.index.v1+json"' /tmp/index.json
          jq -e '.manifests | length == 4' /tmp/index.json
          jq -e '
            [.manifests[]
              | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
              | select(.mediaType == "application/vnd.oci.image.manifest.v1+json")
              | .platform
              | "\(.os)/\(.architecture)"]
            | sort == ["linux/amd64", "linux/arm64"]
          ' /tmp/index.json
          jq -e '
            [.manifests[]
              | select((.annotations["vnd.docker.reference.type"] // "") == "attestation-manifest")]
            | length == 2
            and all(
              .mediaType == "application/vnd.oci.image.manifest.v1+json"
              and .platform.os == "unknown"
              and .platform.architecture == "unknown"
            )
          ' /tmp/index.json
          jq -e '
            ([.manifests[]
              | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
              | .digest] | sort) as $images
            | ([.manifests[]
              | select((.annotations["vnd.docker.reference.type"] // "") == "attestation-manifest")
              | .annotations["vnd.docker.reference.digest"]] | sort) as $subjects
            | $images == $subjects
          ' /tmp/index.json

          while read -r DIGEST; do
            ATTESTATION=$(docker buildx imagetools inspect --raw "${IMAGE_NAME}@${DIGEST}")
            echo "$ATTESTATION" | jq -e '.mediaType == "application/vnd.oci.image.manifest.v1+json"'
            echo "$ATTESTATION" | jq -e '.config.mediaType == "application/vnd.oci.image.config.v1+json"'
            echo "$ATTESTATION" | jq -e '.layers | length == 1'
            echo "$ATTESTATION" | jq -e '
              [.layers[]
                | select(
                    .mediaType == "application/vnd.in-toto+json"
                    and ((.annotations["in-toto.io/predicate-type"] // "")
                      | startswith("https://slsa.dev/provenance/"))
                  )]
              | length == 1
            '
            echo "$ATTESTATION" | jq -e '
              [.layers[]
                | select(
                    ((.annotations["in-toto.io/predicate-type"] // "")
                      | ascii_downcase
                      | contains("spdx"))
                  )]
              | length == 0
            '
          done < <(jq -r '
            .manifests[]
            | select((.annotations["vnd.docker.reference.type"] // "") == "attestation-manifest")
            | .digest
          ' /tmp/index.json)
      - name: Validate image runtime configuration
        env:
          EXPECTED_REVISION: ${{ needs.verify.outputs.commit }}
        run: |
          for ARCH in amd64 arm64; do
            DIGEST=$(jq -r --arg ARCH "$ARCH" '
              .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == $ARCH)
              | .digest
            ' /tmp/index.json)
            IMAGE_CONFIG=$(docker buildx imagetools inspect --format '{{json .Image}}' "${IMAGE_NAME}@${DIGEST}")
            echo "$IMAGE_CONFIG" | jq -e \
              --arg ARCH "$ARCH" \
              --arg TAG "$TAG" \
              --arg REVISION "$EXPECTED_REVISION" '
              .architecture == $ARCH
              and .os == "linux"
              and .config.Entrypoint == ["/new-api"]
              and .config.WorkingDir == "/data"
              and .config.ExposedPorts["3000/tcp"] == {}
              and (.config.Env | index("PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin") != null)
              and .config.Labels["org.opencontainers.image.version"] == $TAG
              and .config.Labels["org.opencontainers.image.revision"] == $REVISION
            '
          done
      - name: Smoke test both architectures
        run: |
          trap 'docker rm -f new-api-smoke >/dev/null 2>&1 || true' EXIT

          for ARCH in amd64 arm64; do
            DIGEST=$(jq -r --arg ARCH "$ARCH" '
              .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == $ARCH)
              | .digest
            ' /tmp/index.json)

            docker run --detach \
              --name new-api-smoke \
              --platform "linux/${ARCH}" \
              --publish 127.0.0.1:3000:3000 \
              "${IMAGE_NAME}@${DIGEST}"

            READY=false
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:3000/api/status > /tmp/status.json; then
                READY=true
                break
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' new-api-smoke)" != "true" ]; then
                docker logs new-api-smoke
                exit 1
              fi
              sleep 2
            done

            if [ "$READY" != "true" ]; then
              docker logs new-api-smoke
              exit 1
            fi
            jq -e '.success == true' /tmp/status.json
            docker rm -f new-api-smoke
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign platform images and OCI index
        run: |
          jq -r '
            .manifests[]
            | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))
            | .digest
          ' /tmp/index.json | while read -r DIGEST; do
            cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          done
          cosign sign --yes "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Image summary
        run: |
          echo "### Multi-arch OCI Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
